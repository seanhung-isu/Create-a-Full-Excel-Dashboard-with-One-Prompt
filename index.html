<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣銷售績效儀表板</title>
    <!-- 引入 Google Fonts: Poppins (數字與英文) 與 Noto Sans TC (中文) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --blue: #2563eb;
            --cyan: #0891b2;
            --green: #059669;
            --amber: #d97706;
            --violet: #7c3aed;
            --rose: #e11d48;
            --blue-light: #dbeafe;
        }

        * { box-sizing: border-box; }
        body {
            /* 混搭字體：英文數字用 Poppins，中文用 Noto Sans TC */
            font-family: 'Poppins', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            margin: 0; padding: 40px 20px;
            color: #1e293b;
        }

        .header { text-align: center; margin-bottom: 40px; }
        .pill-eyebrow {
            background: var(--blue-light); color: var(--blue);
            padding: 4px 16px; border-radius: 999px;
            font-size: 0.85rem; font-weight: 600; display: inline-block; margin-bottom: 12px;
        }
        .header h1 { font-weight: 800; font-size: 2.5rem; margin: 0; }
        .header h1 span { color: var(--blue); }
        .divider {
            width: 60px; height: 4px;
            background: linear-gradient(90deg, var(--blue), var(--cyan));
            margin: 15px auto; border-radius: 2px;
        }

        #upload-screen {
            max-width: 600px; margin: 40px auto;
            background: var(--card-bg);
            border: 2px dashed var(--border-color);
            border-radius: 16px; padding: 60px;
            text-align: center; transition: 0.3s;
        }
        #upload-screen:hover { border-color: var(--blue); }
        .btn-upload {
            background: var(--blue); color: white;
            padding: 12px 32px; border-radius: 8px;
            border: none; font-weight: 600; cursor: pointer; margin-top: 20px;
            font-family: inherit; font-size: 1rem;
        }

        #dashboard { display: none; max-width: 1200px; margin: 0 auto; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .live-dot-pill {
            background: white; padding: 8px 20px; border-radius: 999px;
            border: 1px solid var(--border-color); font-weight: 600;
            display: flex; align-items: center; gap: 10px;
        }
        .dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .grid-kpi { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .grid-2col { display: grid; grid-template-columns: 1.6fr 1fr; gap: 24px; margin-bottom: 24px; }
        .grid-3col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }

        .card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 16px; padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        
        .kpi-card { border-left: 6px solid var(--blue); }
        .kpi-val { font-weight: 800; font-size: 30px; display: block; margin-top: 5px; font-family: 'Poppins', sans-serif;}
        .kpi-label { font-size: 0.85rem; color: #64748b; font-weight: 600; letter-spacing: 0.5px; }

        .fade-up { animation: fadeUp 0.6s ease-out forwards; opacity: 0; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="header">
    <div class="pill-eyebrow">企業數據分析引擎</div>
    <h1>銷售績效 <span>儀表板</span></h1>
    <div class="divider"></div>
</div>

<div id="upload-screen">
    <h3 style="margin-top:0">載入銷售資料</h3>
    <p style="color: #64748b">請選擇您的 <code>sales_taiwan.json</code> 檔案以產生分析報表。</p>
    <input type="file" id="file-input" accept=".json" style="display:none">
    <button class="btn-upload" onclick="document.getElementById('file-input').click()">選擇檔案</button>
</div>

<div id="dashboard">
    <div class="status-bar">
        <div class="live-dot-pill"><span class="dot"></span> 已同步 <span id="record-count">0</span> 筆紀錄</div>
        <button style="cursor:pointer; background:none; border:none; color:#64748b; font-weight:600;" onclick="location.reload()">重新上傳</button>
    </div>

    <div class="grid-kpi">
        <div class="card kpi-card fade-up" style="border-left-color: var(--blue); animation-delay: 0.1s;">
            <span class="kpi-label">總營收 (REVENUE)</span>
            <span id="kpi-revenue" class="kpi-val">NT$0</span>
        </div>
        <div class="card kpi-card fade-up" style="border-left-color: var(--cyan); animation-delay: 0.2s;">
            <span class="kpi-label">淨利潤 (PROFIT)</span>
            <span id="kpi-profit" class="kpi-val">NT$0</span>
        </div>
        <div class="card kpi-card fade-up" style="border-left-color: var(--green); animation-delay: 0.3s;">
            <span class="kpi-label">總銷量 (UNITS)</span>
            <span id="kpi-units" class="kpi-val">0</span>
        </div>
        <div class="card kpi-card fade-up" style="border-left-color: var(--amber); animation-delay: 0.4s;">
            <span class="kpi-label">平均客單價 (AOV)</span>
            <span id="kpi-aov" class="kpi-val">NT$0</span>
        </div>
    </div>

    <div class="grid-2col">
        <div class="card fade-up" style="animation-delay: 0.5s;">
            <h4 style="margin:0 0 20px 0">營收與利潤趨勢</h4>
            <div id="chart-line"></div>
        </div>
        <div class="card fade-up" style="animation-delay: 0.6s;">
            <h4 style="margin:0 0 20px 0">客群佔比</h4>
            <div id="chart-donut"></div>
        </div>
    </div>

    <div class="grid-2col">
        <div class="card fade-up" style="animation-delay: 0.7s;">
            <h4 style="margin:0 0 20px 0">台灣各縣市銷售分佈</h4>
            <div id="chart-map" style="height: 400px;"></div>
        </div>
        <div class="card fade-up" style="animation-delay: 0.8s;">
            <h4 style="margin:0 0 20px 0">前 10 大熱銷商品</h4>
            <div id="chart-bar"></div>
        </div>
    </div>

    <div class="grid-3col">
        <div class="card fade-up" style="animation-delay: 0.9s;">
            <h4 style="margin:0 0 10px 0; font-size:1rem; text-align:center;">各運送方式利潤佔比</h4>
            <div id="ship-profit"></div>
        </div>
        <div class="card fade-up" style="animation-delay: 1.0s;">
            <h4 style="margin:0 0 10px 0; font-size:1rem; text-align:center;">各運送方式銷量佔比</h4>
            <div id="ship-units"></div>
        </div>
        <div class="card fade-up" style="animation-delay: 1.1s;">
            <h4 style="margin:0 0 10px 0; font-size:1rem; text-align:center;">各運送方式訂單數</h4>
            <div id="ship-orders"></div>
        </div>
    </div>
</div>

<script>
    // 運送方式配色映射
    const shipModeColors = {
        "標準配送": "#2563eb",
        "快速配送": "#0891b2",
        "優先配送": "#7c3aed",
        "當日配": "#e11d48"
    };

    // Plotly 共用設定
    const commonLayout = {
        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: 'rgba(0,0,0,0)',
        font: { family: 'Poppins, Noto Sans TC', color: '#1e293b' },
        margin: { t: 10, r: 10, l: 40, b: 40 },
        showlegend: false
    };

    let taiwanGeoJson = null;

    // 非同步載入台灣 GeoJSON (使用 g0v 開放資料)
    fetch('https://raw.githubusercontent.com/g0v/twgeojson/master/json/twCounty2010.geo.json')
        .then(response => response.json())
        .then(data => { taiwanGeoJson = data; })
        .catch(err => console.error("無法載入台灣地圖資料", err));

    document.getElementById('file-input').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            const rawData = JSON.parse(event.target.result);
            processAndRender(rawData);
        };
        reader.readAsText(file);
    };

    // 處理「台」與「臺」的字體轉換，確保地圖比對正確
    function normalizeCityName(cityName) {
        if(!cityName) return "";
        return cityName.replace('台', '臺');
    }

    function processAndRender(rawData) {
        if (!taiwanGeoJson) {
            alert("地圖資料載入中，請稍候再試。");
            return;
        }

        document.getElementById('upload-screen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';

        // 1. 資料清理與轉換
        const cleanData = rawData.map(d => ({
            ...d,
            Sales: Number(String(d.Sales).replace(/[^0-9.-]+/g,"")),
            Profit: Number(String(d.Profit).replace(/[^0-9.-]+/g,"")),
            Quantity: Number(d.Quantity),
            // 將 DD/MM/YYYY 轉為可排序的 Date 物件
            DateObj: new Date(d["Order Date"].split('/').reverse().join('-')) 
        })).sort((a,b) => a.DateObj - b.DateObj);

        document.getElementById('record-count').innerText = cleanData.length;

        // 2. KPI 計算
        const rev = cleanData.reduce((s, d) => s + d.Sales, 0);
        const pro = cleanData.reduce((s, d) => s + d.Profit, 0);
        const unit = cleanData.reduce((s, d) => s + d.Quantity, 0);

        document.getElementById('kpi-revenue').innerText = `NT$${Math.round(rev).toLocaleString()}`;
        document.getElementById('kpi-profit').innerText = `NT$${Math.round(pro).toLocaleString()}`;
        document.getElementById('kpi-units').innerText = unit.toLocaleString();
        document.getElementById('kpi-aov').innerText = `NT$${Math.round(rev / cleanData.length).toLocaleString()}`;

        // 3. 繪製圖表
        
        // --- 面積折線圖 ---
        const timeline = {};
        cleanData.forEach(d => {
            const k = d["Order Date"];
            timeline[k] = timeline[k] || {s:0, p:0};
            timeline[k].s += d.Sales;
            timeline[k].p += d.Profit;
        });
        Plotly.newPlot('chart-line', [
            { x: Object.keys(timeline), y: Object.values(timeline).map(v=>v.s), fill: 'tozeroy', name: '營收', line:{shape:'spline', color:'#2563eb'} },
            { x: Object.keys(timeline), y: Object.values(timeline).map(v=>v.p), fill: 'tozeroy', name: '利潤', line:{shape:'spline', color:'#059669'} }
        ], {...commonLayout, showlegend: true, legend: {orientation:'h', y:-0.2}}, {displayModeBar:false});

        // --- 客群環形圖 ---
        const segs = {};
        cleanData.forEach(d => segs[d.Segment] = (segs[d.Segment] || 0) + 1);
        Plotly.newPlot('chart-donut', [{
            labels: Object.keys(segs), values: Object.values(segs), type: 'pie', hole: 0.58,
            marker: { colors: ['#2563eb', '#7c3aed', '#0891b2'] }, textinfo: 'label+percent'
        }], commonLayout, {displayModeBar:false});

        // --- 台灣地理圖 (重點修改區塊) ---
        const citySales = {};
        cleanData.forEach(d => {
            // 將「台北市」轉為「臺北市」以對應 GeoJSON 的屬性
            const city = normalizeCityName(d.City); 
            citySales[city] = (citySales[city] || 0) + d.Sales;
        });

        Plotly.newPlot('chart-map', [{
            type: 'choropleth',
            geojson: taiwanGeoJson,
            locations: Object.keys(citySales),
            featureidkey: 'properties.COUNTYNAME', // GeoJSON 中儲存縣市名稱的欄位
            z: Object.values(citySales),
            colorscale: [[0, '#dbeafe'], [1, '#2563eb']],
            showscale: false,
            marker: { line: { color: 'white', width: 0.5 } }
        }], {
            ...commonLayout, 
            geo: {
                fitbounds: "locations", // 自動縮放至有資料的區域（台灣）
                visible: false // 隱藏預設的世界地圖底圖
            }
        }, {displayModeBar:false});

        // --- 長條圖 (熱銷商品) ---
        const prods = {};
        cleanData.forEach(d => prods[d["Product Name"]] = (prods[d["Product Name"]] || 0) + d.Sales);
        const top10 = Object.entries(prods).sort((a,b) => b[1]-a[1]).slice(0,10).reverse();
        Plotly.newPlot('chart-bar', [{
            x: top10.map(v=>v[1]), y: top10.map(v=>v[0]), type:'bar', orientation:'h',
            marker: { color: '#2563eb' }
        }], {...commonLayout, margin:{l:150, t:10}}, {displayModeBar:false});

        // --- 底部運送方式三組環形圖 ---
        const ship = {};
        cleanData.forEach(d => {
            const m = d["Ship Mode"];
            ship[m] = ship[m] || {p:0, q:0, c:0};
            ship[m].p += d.Profit; ship[m].q += d.Quantity; ship[m].c += 1;
        });
        const mKeys = Object.keys(ship);
        const mColors = mKeys.map(k => shipModeColors[k] || '#94a3b8'); // 加上 fallback 顏色
        const donutTpl = { type:'pie', hole:0.7, labels:mKeys, marker:{colors:mColors}, textinfo:'none' };

        Plotly.newPlot('ship-profit', [{...donutTpl, values: mKeys.map(k=>ship[k].p)}], commonLayout, {displayModeBar:false});
        Plotly.newPlot('ship-units', [{...donutTpl, values: mKeys.map(k=>ship[k].q)}], commonLayout, {displayModeBar:false});
        Plotly.newPlot('ship-orders', [{...donutTpl, values: mKeys.map(k=>ship[k].c)}], commonLayout, {displayModeBar:false});
    }
</script>

</body>
</html>
